<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вход</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --text:#1c1e26; --muted:#6b7280; --border:#e2e4ea; --accent:#4f6df5; --err:#ef4444; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14151a; --card:#1e2027; --text:#eceef2; --muted:#9aa0ac; --border:#2c2f38; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; padding:16px; }
  .box { width:100%; max-width:340px; background:var(--card); border:1px solid var(--border);
         border-radius:16px; padding:24px; }
  h1 { font-size:19px; margin:0 0 4px; }
  p { margin:0 0 18px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12.5px; color:var(--muted); margin:0 0 4px; }
  input { width:100%; padding:11px 12px; margin-bottom:14px; border-radius:10px;
          border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:15px; }
  button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--accent);
           color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; }
  #err { color:var(--err); font-size:13px; min-height:18px; margin-top:10px; text-align:center; }
</style>
</head>
<body>
<div class="box">
  <h1>Посещаемость группы</h1>
  <p>Введите логин и пароль, чтобы открыть сайт</p>
  <label for="u">Логин</label>
  <input id="u" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
  <label for="p">Пароль</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="go">Войти</button>
  <div id="err"></div>
</div>

const ITER = 600000;
const SESSION_MS = 2 * 60 * 60 * 1000;   // вход действует 2 часа
const STORE = "auth-session-v2";
const enc = new TextEncoder();

function b64(s) { return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
function toB64(buf) { return btoa(String.fromCharCode(...new Uint8Array(buf))); }

function parts() {
  const raw = b64(PAYLOAD);
  return { salt: raw.slice(0, 16), iv: raw.slice(16, 28), data: raw.slice(28) };
}

async function deriveKey(login, password) {
  const p = parts();
  const base = await crypto.subtle.importKey("raw", enc.encode(login.trim().toLowerCase() + ":" + password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: p.salt, iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}

async function decryptWith(key) {
  const p = parts();
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: p.iv }, key, p.data);
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

function clearSession() {
  try { localStorage.removeItem(STORE); } catch (e) {}
}

const err = document.getElementById("err");
const btn = document.getElementById("go");

async function tryLogin(login, password) {
  btn.disabled = true;
  err.textContent = "Проверяем…";
  try {
    const key = await deriveKey(login, password);
    const html = await decryptWith(key);
    try {
      const raw = await crypto.subtle.exportKey("raw", key);
      localStorage.setItem(STORE, JSON.stringify({ k: toB64(raw), exp: Date.now() + SESSION_MS }));
    } catch (e) {}
    show(html);
  } catch (e) {
    err.textContent = "Неверный логин или пароль";
    btn.disabled = false;
  }
}

async function tryStored() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE) || "null");
    if (!s || !s.k || Date.now() > s.exp) { clearSession(); return; }
    const key = await crypto.subtle.importKey("raw", b64(s.k), "AES-GCM", false, ["decrypt"]);
    show(await decryptWith(key));
  } catch (e) {
    clearSession();
  }
}

btn.addEventListener("click", () => {
  tryLogin(document.getElementById("u").value, document.getElementById("p").value);
});
document.addEventListener("keydown", e => { if (e.key === "Enter") btn.click(); });

tryStored();
</script>
